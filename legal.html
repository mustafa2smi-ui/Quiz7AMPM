    :root {

      --accent: #ffd700;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); padding-bottom: 60px; line-height: 1.6; }

    /* Header */
    .legal-header {
      background: rgba(9, 12, 18, 0.98); border-bottom: 1px solid var(--card-border);
      padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
    }
    .brand-title { font-weight: 800; font-size: 16px; color: #fff; }
    .brand-title span { color: var(--accent); }
    .lang-btn {
      background: rgba(255,215,0,0.15); border: 1px solid var(--accent); color: var(--accent);
      padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer;
    }

    .main-wrap { max-width: 900px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* Tabs Bar */
    .tab-bar {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-item {
      background: rgba(255,255,255,0.05); border: 1px solid var(--card-border);
      color: var(--text-muted); padding: 8px 16px; border-radius: 8px; font-size: 13px;
      font-weight: 700; white-space: nowrap; cursor: pointer; text-decoration: none;
    }
    .tab-item.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Content Card */
    .policy-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px;
    }
    h2 { font-size: 18px; color: var(--accent); border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }
    h3 { font-size: 14px; color: #fff; margin-top: 10px; }
    p, li { font-size: 13px; color: #cbd5e1; }
    ul { margin-left: 20px; display: flex; flex-direction: column; gap: 6px; }

    .highlight-box {
      background: rgba(229, 9, 20, 0.1); border-left: 3px solid var(--primary);
      padding: 12px; border-radius: 6px; font-size: 12px; color: #fca5a5;
    }

    /* Accordion for FAQ */
    .faq-item {
      border: 1px solid var(--card-border); border-radius: 8px; margin-bottom: 8px; overflow: hidden;
    }
    .faq-q {
      background: rgba(255,255,255,0.03); padding: 12px 14px; font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .faq-a { display: none; padding: 12px 14px; font-size: 12px; color: #cbd5e1; background: rgba(0,0,0,0.2); }
    .faq-item.open .faq-a { display: block; }
    .faq-item.open .faq-q { color: var(--accent); }

    .back-home { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

</head>

            <div class="faq-item">
              <div class="faq-q" onclick="toggleFaq(this)">Q4. विजेता चुने जाने के बाद इनाम कैसे मिलता है? <span>▼</span></div>
              <div class="faq-a">लाइव समाप्त होने के बाद हमारी टीम आपके फॉर्म में दिए गए WhatsApp नंबर पर संपर्क करेगी और UPI द्वारा नकद पुरस्कार सीधे आपके खाते में भेज दिया जाएगा।</div>
            </div>
            <div class="faq-item">
              <div class="faq-q" onclick="toggleFaq(this)">Q5. क्या मेरी निजी जानकारी सुरक्षित है? <span>▼</span></div>
              <div class="faq-a">हाँ, बिल्कुल! आपका WhatsApp नंबर पब्लिक शीट में कभी नहीं दिखाया जाता। वह पूरी तरह एन्क्रिप्टेड और सुरक्षित रहता है।</div>
            </div>
          `
        },
        en: {
          title: "Frequently Asked Questions (FAQ)",
          html: `
            <div class="faq-item open">
              <div class="faq-q" onclick="toggleFaq(this)">Q1. Is there an entry fee to join the quiz? <span>▼</span></div>
              <div class="faq-a">No. All our quizzes and contests are 100% free of cost.</div>
            </div>
            <div class="faq-item">
              <div class="faq-q" onclick="toggleFaq(this)">Q2. Where do I find the Question Code? <span>▼</span></div>
              <div class="faq-a">The 3-digit Question Code is displayed directly on the video screen during the YouTube live broadcast.</div>
            </div>
            <div class="faq-item">
              <div class="faq-q" onclick="toggleFaq(this)">Q3. Can I submit multiple answers for a single question? <span>▼</span></div>
              <div class="faq-a">You may only have your first recorded submission counted. Any subsequent submissions are automatically disregarded by our deduplication engine.</div>
            </div>
            <div class="faq-item">
              <div class="faq-q" onclick="toggleFaq(this)">Q4. How are winners paid? <span>▼</span></div>
              <div class="faq-a">Winners are contacted directly via the WhatsApp number entered in their submission form. Prize money is disbursed via UPI transfer within 24 hours.</div>
            </div>
            <div class="faq-item">
              <div class="faq-q" onclick="toggleFaq(this)">Q5. Is my WhatsApp number publicly exposed? <span>▼</span></div>
              <div class="faq-a">Never. Public display sheets strictly exclude phone numbers. Only names and locations are displayed for transparency.</div>
            </div>
          `
        }
      }
    };

    function renderPolicy() {
      const container = document.getElementById('policyCardContent');
      const data = LEGAL_CONTENT[currentTab][currentLang];
      container.innerHTML = `
        <h2>${data.title}</h2>
        ${data.html}
      `;
    }

    function showLegalTab(tabKey, btn) {
      currentTab = tabKey;
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPolicy();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'hi' ? 'en' : 'hi';
      document.getElementById('langSwitcherBtn').innerText = currentLang === 'hi' ? 'English में पढ़ें' : 'हिन्दी में पढ़ें';
      renderPolicy();
    }

    function toggleFaq(el) {
      const parent = el.parentElement;
      parent.classList.toggle('open');
    }

    // Auto-load on start
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tabParam = urlParams.get('tab');
      if (tabParam && LEGAL_CONTENT[tabParam]) {
        currentTab = tabParam;
        document.querySelectorAll('.tab-item').forEach(b => {
          if (b.getAttribute('onclick').includes(`'${tabParam}'`)) b.classList.add('active');
          else b.classList.remove('active');
        });
      }
      renderPolicy();
    });
  </script>
</body>
</html>
