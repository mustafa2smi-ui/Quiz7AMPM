  <style>
    :root {
      --bg-dark: #090c12;
      --card-bg: rgba(20, 25, 38, 0.95);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #e50914;
      --accent: #ffd700;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --wrong: #ef4444;
      --dock-bg: rgba(14, 18, 27, 0.96);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 90px; }

    .app-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(9, 12, 18, 0.97); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 18px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .brand-logo { background: linear-gradient(135deg, var(--primary), #ff5722); color: #fff; font-weight: 900; font-size: 13px; padding: 5px 9px; border-radius: 6px; }
    .brand-text h1 { font-size: 15px; font-weight: 800; }

    .breadcrumb-nav { max-width: 900px; margin: 10px auto 0; padding: 0 16px; font-size: 11px; color: var(--text-muted); }
    .breadcrumb-nav a { color: var(--accent); text-decoration: none; }

    .main-wrapper { max-width: 900px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }

    /* Category Filter Tabs */
    .category-scroll {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border);
      color: #cbd5e1; padding: 6px 14px; border-radius: 20px; font-size: 12px;
      font-weight: 700; white-space: nowrap; cursor: pointer; transition: 0.2s;
    }
    .cat-btn.active, .cat-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Quiz Card */
    .quiz-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .badge-qcode { background: rgba(255, 215, 0, 0.15); color: var(--accent); font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
    .badge-cat { font-size: 11px; color: var(--text-muted); }

    .question-title { font-size: 15px; font-weight: 700; line-height: 1.5; color: #fff; }

    .options-list { display: flex; flex-direction: column; gap: 8px; }
    .opt-btn {
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--card-border);
      color: #f1f5f9; padding: 10px 14px; border-radius: 10px; font-size: 13px;
      text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px;
    }
    .opt-btn:hover { background: rgba(255, 255, 255, 0.08); }
    .opt-letter { font-weight: 800; color: var(--accent); width: 18px; }

    /* Feedback colors */
    .opt-btn.correct { background: rgba(16, 185, 129, 0.2) !important; border-color: var(--success) !important; color: #a7f3d0 !important; }
    .opt-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--wrong) !important; color: #fecaca !important; }

    /* Explanation Box */
    .explanation-box {
      display: none; padding: 12px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.04); border-left: 3px solid var(--accent);
      font-size: 12px; color: #e2e8f0; line-height: 1.5;
    }

    /* Bottom Dock */
    .bottom-dock {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--dock-bg);
      backdrop-filter: blur(14px); border-top: 1px solid var(--card-border);
      display: flex; justify-content: space-around; padding: 8px 6px; z-index: 100;
    }
    .dock-item { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--text-muted); font-size: 10px; font-weight: 700; }
    .dock-item.active { color: var(--accent); }
    .dock-icon { font-size: 17px; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="app-header">
    <div class="brand-wrap">
      <div class="brand-logo">7AMPM</div>
      <div class="brand-text">
        <h1>PRACTICE CARDS</h1>
      </div>
    </div>
    <a href="index.html" style="color: var(--accent); text-decoration: none; font-size: 12px; font-weight: 700;">← वापस होमपेज</a>
  </header>

  <!-- Breadcrumb -->
  <nav class="breadcrumb-nav">
    <span>🏠 <a href="index.html">होमपेज</a></span> / <span>डेली प्रैक्टिस कार्ड्स</span>
  </nav>

  <!-- Main Content -->
  <main class="main-wrapper">

    <!-- Categories -->
    <div class="category-scroll" id="categoryTabs">
      <button class="cat-btn active" onclick="filterQuiz('All', this)">सभी विषय (All)</button>
      <button class="cat-btn" onclick="filterQuiz('Indian History', this)">इतिहास</button>
      <button class="cat-btn" onclick="filterQuiz('Geography', this)">भूगोल</button>
      <button class="cat-btn" onclick="filterQuiz('General Science', this)">सामान्य विज्ञान</button>
      <button class="cat-btn" onclick="filterQuiz('Current Affairs', this)">करेंट अफेयर्स</button>
    </div>

    <!-- Container for dynamic quiz cards -->
    <div id="quizCardsContainer" style="display: flex; flex-direction: column; gap: 14px;">
      <p style="text-align: center; color: var(--text-muted); padding: 30px 0;">प्रश्न लोड हो रहे हैं…</p>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-dock">
    <a href="index.html" class="dock-item">
      <span class="dock-icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="quizpage.html" class="dock-item active">
      <span class="dock-icon">🎯</span>
      <span>Practice</span>
    </a>
  </nav>

  <!-- JavaScript Engine -->
  <script>
    let rawQuizData = [];

    // 1. Fetch JSON Data
    document.addEventListener('DOMContentLoaded', () => {
      fetch('quizoption.json')
        .then(res => res.json())
        .then(data => {
          rawQuizData = data;
          renderCards(rawQuizData);
        })
        .catch(err => {
          document.getElementById('quizCardsContainer').innerHTML = `
            <div style="text-align: center; padding: 30px; color: #ff9999;">
              ⚠️ quizoption.json फ़ाइल लोड नहीं हो सकी। कृपया जाँचें कि फ़ाइल सही जगह पर है।
            </div>`;
        });
    });

    // 2. Render Cards to Screen
    function renderCards(list) {
      const container = document.getElementById('quizCardsContainer');
      container.innerHTML = "";

      if(list.length === 0) {
        container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 20px;">इस श्रेणी में अभी कोई प्रश्न नहीं हैं।</p>`;
        return;
      }

      list.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "quiz-card";

        card.innerHTML = `
          <div class="card-top">
            <span class="badge-qcode">QC-${item.qCode}</span>
            <span class="badge-cat">${item.category}</span>
          </div>
          <div class="question-title">Q${index + 1}. ${item.question}</div>
          <div class="options-list">
            ${item.options.map(opt => `
              <button class="opt-btn" onclick="checkAnswer(this, '${opt.letter}', '${item.correct}')">
                <span class="opt-letter">${opt.letter}</span>
                <span>${opt.text}</span>
              </button>
            `).join('')}
          </div>
          <div class="explanation-box">
            💡 <strong>व्याख्या:</strong> ${item.explanation}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 3. Option Selection & Feedback Logic
    function checkAnswer(btn, chosen, correct) {
      const card = btn.closest('.quiz-card');
      const allBtns = card.querySelectorAll('.opt-btn');
      const expBox = card.querySelector('.explanation-box');

      allBtns.forEach(b => {
        b.onclick = null; // lock other choices
        const letter = b.querySelector('.opt-letter').innerText.trim();
        if (letter === correct) {
          b.classList.add('correct');
        }
      });

      if (chosen !== correct) {
        btn.classList.add('wrong');
      }

      expBox.style.display = "block";
    }

    // 4. Category Filter
    function filterQuiz(category, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (category === 'All') {
        renderCards(rawQuizData);
      } else {
        const filtered = rawQuizData.filter(q => q.category === category);
        renderCards(filtered);
      }
    }
  </script>
</body>
</html>
